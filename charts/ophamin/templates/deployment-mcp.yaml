{{- if .Values.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ophamin.fullname" . }}-mcp
  labels:
    {{- include "ophamin.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-serve
spec:
  replicas: {{ .Values.mcp.replicas }}
  selector:
    matchLabels:
      {{- include "ophamin.mcpSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ophamin.mcpSelectorLabels" . | nindent 8 }}
        {{- with .Values.mcp.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.mcp.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ophamin.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ophamin-mcp
          image: {{ include "ophamin.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # MCP defaults to stdio transport, which doesn't fit K8s.
          # For K8s deployment use streamable-http on a TCP port.
          args:
            - mcp
            - serve
            - --transport
            - {{ .Values.mcp.transport | quote }}
            - --port
            - {{ .Values.mcp.port | quote }}
          ports:
            - name: mcp
              containerPort: {{ .Values.mcp.port }}
              protocol: TCP
          {{- with .Values.mcp.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # MCP has no /health endpoint per se; rely on TCP probe.
          livenessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
