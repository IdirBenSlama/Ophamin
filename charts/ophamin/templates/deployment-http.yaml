{{- if .Values.http.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ophamin.fullname" . }}-http
  labels:
    {{- include "ophamin.labels" . | nindent 4 }}
    app.kubernetes.io/component: http-serve
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.http.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ophamin.httpSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ophamin.httpSelectorLabels" . | nindent 8 }}
        {{- with .Values.http.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if include "ophamin.aksPodLabelEnabled" . }}
        azure.workload.identity/use: "true"
        {{- end }}
      {{- with .Values.http.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ophamin.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: ophamin-http
          image: {{ include "ophamin.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # ENTRYPOINT in the Dockerfile is `ophamin`; we pass the
          # `http serve` subcommand + flags as args.
          args:
            - http
            - serve
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --workers
            - {{ .Values.http.workers | quote }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          {{- with .Values.http.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.http.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.http.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.http.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
