{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ophamin.fullname" . }}-mcp
  labels:
    {{- include "ophamin.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-serve
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: mcp
      port: {{ .Values.service.mcp.port }}
      targetPort: {{ .Values.service.mcp.targetPort }}
      protocol: TCP
  selector:
    {{- include "ophamin.mcpSelectorLabels" . | nindent 4 }}
{{- end }}
