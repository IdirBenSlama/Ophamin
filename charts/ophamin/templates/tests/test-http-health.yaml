{{- if .Values.http.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ophamin.fullname" . }}-test-http-health
  labels:
    {{- include "ophamin.labels" . | nindent 4 }}
    app.kubernetes.io/component: helm-test
  annotations:
    # `helm test` runs Pods with the "helm.sh/hook: test" annotation
    # and reports their success/failure. "hook-delete-policy" cleans
    # up the test Pod after the run.
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      # Use a minimal curl image rather than busybox-wget — curl handles
      # the --fail-with-body / response-body inspection cleanly. The
      # image is pinned by digest (8.10.1) for reproducibility.
      image: curlimages/curl:8.10.1
      command:
        - sh
        - -c
        - |
          set -e
          echo "Hitting /health on {{ include "ophamin.fullname" . }}-http..."
          # Retry briefly to allow rolling-update startup. The Deployment's
          # readiness probe should normally have admitted the pod into
          # the Service by helm-test time, but tolerate slight skew.
          for i in 1 2 3 4 5; do
              if curl --fail --silent --max-time 5 \
                  "http://{{ include "ophamin.fullname" . }}-http:{{ .Values.service.http.port }}/health"; then
                  echo
                  echo "OK — /health responded"
                  exit 0
              fi
              echo "Attempt $i failed; sleeping 3s"
              sleep 3
          done
          echo "ERROR: /health did not respond after 5 attempts"
          exit 1
{{- end }}
