name: docs

# Build + deploy the mkdocs site to GitHub Pages on every push to main.
# Pull requests build but do NOT deploy (preview only).
on:
  push:
    branches: [main]
    tags: ["v*"]      # per-release doc snapshots (0.8.2+)
  pull_request:
    branches: [main]
  # Manual trigger for forced rebuilds.
  workflow_dispatch:

# Mandatory permissions for the deploy step. The build job is fine
# with read-only.
#   contents:    read  — checkout
#   pages:       write — deploy
#   id-token:    write — Pages OIDC deploy
#   actions:     read  — gh run download (fetch bench-dashboard artifact
#                        from the bench workflow for /bench/ page; 0.44.0)
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# Allow only one deploy at a time per branch, but don't cancel in-flight
# deploys — losing the previous deploy mid-flight can leave the site in
# a torn state.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build mkdocs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # mkdocs git-revision-date plugin needs full history

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs deps
        run: |
          python -m pip install --upgrade pip
          # Install ophamin + docs extra so mkdocstrings can introspect.
          pip install -e ".[docs]"

      - name: Build site (strict — fails on any warning)
        # 0.8.2 cleanup pass landed: every cross-file link in the source
        # files now uses absolute GitHub URLs (so it resolves both in
        # the GitHub repo browser AND under mkdocs). Strict mode catches
        # any future link rot at PR time.
        run: mkdocs build --strict

      # ── Public bench dashboard (0.44.0) ───────────────────────────────
      # Fetch the latest `bench-dashboard` artifact from the bench
      # workflow + drop it into site/bench/ so it gets deployed to
      # https://idirbenslama.github.io/Ophamin/bench/.
      #
      # Uses `gh run download` (preinstalled on ubuntu-latest runners)
      # so we don't add a third-party action dependency. The fetch is
      # gracefully optional — if the bench workflow hasn't run recently
      # or the artifact has expired (90-day retention per bench.yml),
      # the site still deploys, just without the /bench/ path.
      - name: Fetch latest bench dashboard
        # gh run download requires GH_TOKEN; the built-in GITHUB_TOKEN
        # works for cross-workflow artifact reads.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site/bench
          # Find the most recent successful bench workflow run; ignore
          # failure (no bench runs / expired artifacts → empty /bench/
          # but site still deploys).
          LATEST_RUN=$(gh run list \
              --workflow=bench.yml \
              --branch=main \
              --status=completed \
              --limit=10 \
              --json databaseId,conclusion \
              --jq '[.[] | select(.conclusion == "success")][0].databaseId' \
              || echo "")
          if [ -z "$LATEST_RUN" ] || [ "$LATEST_RUN" = "null" ]; then
              echo "No successful bench workflow run found; skipping /bench/."
              # Drop a placeholder index so links don't 404.
              cat > site/bench/index.html <<'EOF'
          <!DOCTYPE html><html><head><meta charset="utf-8"><title>Ophamin bench dashboard</title></head>
          <body><h1>Ophamin bench dashboard</h1>
          <p>No bench data yet. The <code>bench</code> workflow has not produced a
          successful run with a dashboard artifact, or the artifact has expired
          (90-day retention). See the
          <a href="https://github.com/IdirBenSlama/Ophamin/actions/workflows/bench.yml">
          bench workflow page</a> for recent runs.</p>
          </body></html>
          EOF
          else
              echo "Fetching bench-dashboard from run $LATEST_RUN"
              gh run download "$LATEST_RUN" \
                  --name bench-dashboard \
                  --dir site/bench \
                  || {
                      echo "Artifact download failed (expired?); using placeholder."
                      cat > site/bench/index.html <<'EOF'
          <!DOCTYPE html><html><head><meta charset="utf-8"><title>Ophamin bench dashboard</title></head>
          <body><h1>Ophamin bench dashboard</h1>
          <p>The latest bench-dashboard artifact has expired. Run the bench workflow to
          regenerate.</p></body></html>
          EOF
                  }
          fi
          ls -la site/bench/ || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    # Deploy only from main-branch push or manual workflow_dispatch.
    # PR builds are preview-only (no deploy); tag pushes build but
    # don't redeploy main's content (the tag's docs snapshot is kept
    # as a build artefact only — multi-version docs is a future RFC).
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    # Hard-fail on deploy errors. The repo went public + Pages was
    # enabled (build_type=workflow) on 2026-05-17 (post-0.8.4); the
    # site is live at https://idirbenslama.github.io/Ophamin/. Any
    # future deploy failure (quota, artifact-size limit, token
    # rotation, etc.) should fail loud so it lands as an owner-
    # actionable signal rather than silent skew.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
