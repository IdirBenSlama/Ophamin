name: docs

# Build + deploy the mkdocs site to GitHub Pages on every push to main.
# Pull requests build but do NOT deploy (preview only).
on:
  push:
    branches: [main]
    tags: ["v*"]      # per-release doc snapshots (0.8.2+)
  pull_request:
    branches: [main]
  # Manual trigger for forced rebuilds.
  workflow_dispatch:

# Mandatory permissions for the deploy step. The build job is fine
# with read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deploy at a time per branch, but don't cancel in-flight
# deploys — losing the previous deploy mid-flight can leave the site in
# a torn state.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build mkdocs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # mkdocs git-revision-date plugin needs full history

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs deps
        run: |
          python -m pip install --upgrade pip
          # Install ophamin + docs extra so mkdocstrings can introspect.
          pip install -e ".[docs]"

      - name: Build site (strict — fails on any warning)
        # 0.8.2 cleanup pass landed: every cross-file link in the source
        # files now uses absolute GitHub URLs (so it resolves both in
        # the GitHub repo browser AND under mkdocs). Strict mode catches
        # any future link rot at PR time.
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    # Deploy only from main-branch push or manual workflow_dispatch.
    # PR builds are preview-only (no deploy); tag pushes build but
    # don't redeploy main's content (the tag's docs snapshot is kept
    # as a build artefact only — multi-version docs is a future RFC).
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    # GitHub Pages is owner-side configuration (Settings → Pages →
    # Source = "GitHub Actions"). On a Free-plan private repo it's
    # disabled by default and `deploy-pages` returns 404. Treat the
    # deploy step as advisory: the build artefact uploaded by the
    # `build` job is the source of truth; when the owner enables
    # Pages, future runs will deploy without further code changes.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
