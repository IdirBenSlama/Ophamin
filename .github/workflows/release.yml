name: release

# Builds sdist + pure-Python wheel and publishes to PyPI via Trusted
# Publishing (OIDC; no long-lived API tokens).
#
# Trigger model:
#   * `v*` tag push       — auto-release: build + publish to PyPI
#   * workflow_dispatch    — operator-triggered: build + (optional) publish
#
# Owner-side prerequisites (one-time):
#   1. Sign in at https://pypi.org/manage/account/publishing/
#   2. Add a "pending publisher" for `ophamin`:
#        Owner:               IdirBenSlama
#        Repository name:     Ophamin
#        Workflow name:       release.yml
#        Environment name:    pypi
#   3. Once the first release succeeds the publisher promotes to a
#      standard trusted publisher (no further action needed).
#
# Until step 1+2 are completed by the owner, the publish step will fail
# with "trusted publisher invalid_grant" — that's expected and gating.
# The build job will continue to succeed on every tag push so the wheel
# is verifiable as a workflow artefact even before PyPI is wired.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only; skip the publish step"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

# Concurrency: don't double-publish if two tags land in quick succession.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history needed by setuptools-scm-style version helpers
          # (not currently used; cheap insurance for future bumps).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify wheel + sdist with twine
        # twine check enforces:
        #   * README renders correctly on PyPI
        #   * long_description_content_type is well-formed
        #   * no dangling references in the metadata
        run: twine check --strict dist/*

      - name: List built artifacts
        run: ls -la dist/

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ophamin-dist
          path: dist/
          retention-days: 30

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Publish only when triggered by a v* tag push, OR a manual dispatch
    # with dry_run=false. The dry-run path stops at `build` above.
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')
    environment:
      name: pypi
      url: https://pypi.org/project/ophamin/
    # `id-token: write` is REQUIRED for Trusted Publishing — it's the OIDC
    # claim that lets PyPI verify the workflow's identity without an API
    # token sitting in repo secrets.
    permissions:
      id-token: write
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v6
        with:
          name: ophamin-dist
          path: dist/

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` field — Trusted Publishing means PyPI mints a
        # short-lived token from the OIDC claim above. Long-lived tokens
        # in repo secrets are explicitly avoided per RFC 0002 §3.1 Phase E6.
        with:
          packages-dir: dist/
          # `verbose` is useful for diagnosing first-publish issues
          # (most common: pending publisher not yet set up on PyPI side).
          verbose: true
