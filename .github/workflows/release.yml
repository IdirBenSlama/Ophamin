name: release

# Builds sdist + pure-Python wheel, generates SLSA 3 build provenance,
# and publishes to PyPI via Trusted Publishing with PEP 740 attestations.
#
# Three layers of cryptographic attribution attached to every artefact:
#
#   1. SLSA 3 build provenance     — actions/attest-build-provenance@v2
#      Records the {builder, source, command, materials} tuple that
#      produced each artefact. Verifiable via `gh attestation verify`
#      from any GitHub clone of the repo, no extra tooling.
#
#   2. Sigstore cosign signature   — included in (1) via the underlying
#      sigstore transparency log (Rekor). Verifiable via `cosign
#      verify-blob` independently of GitHub.
#
#   3. PEP 740 PyPI attestations   — pypa/gh-action-pypi-publish with
#      `attestations: true`. PyPI publishes the attestations alongside
#      the package; `pip install ophamin --verify-attestations` and
#      downstream tooling can verify provenance at install time.
#
# Trigger model:
#   * `v*` tag push        — auto-release: build → attest → publish
#   * workflow_dispatch    — operator-triggered: build only (dry-run=true) or full chain
#
# Owner-side prerequisites (one-time, PyPI side):
#   1. Sign in at https://pypi.org/manage/account/publishing/
#   2. Add a "pending publisher" for `ophamin`:
#        Owner:               IdirBenSlama
#        Repository name:     Ophamin
#        Workflow name:       release.yml
#        Environment name:    pypi
#   3. Once the first release succeeds the publisher promotes to a
#      standard trusted publisher (no further action needed).
#
# Sigstore + SLSA require zero owner-side setup — they work out of the
# box with GitHub's OIDC. Until the PyPI pending publisher is registered,
# the publish step soft-fails (`continue-on-error: true`); the SLSA
# attestation is generated regardless and visible at
# https://github.com/IdirBenSlama/Ophamin/attestations.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only; skip the publish step"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

# Concurrency: don't double-publish if two tags land in quick succession.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel + SLSA provenance
    runs-on: ubuntu-latest
    # SLSA 3 provenance generation needs OIDC + write to GitHub's
    # attestation store + read of repo contents. These are scoped to
    # only this job, not the whole workflow.
    permissions:
      contents: read
      id-token: write       # required by actions/attest-build-provenance
      attestations: write   # required by actions/attest-build-provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history needed by setuptools-scm-style version helpers
          # (not currently used; cheap insurance for future bumps).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify wheel + sdist with twine
        # twine check enforces:
        #   * README renders correctly on PyPI
        #   * long_description_content_type is well-formed
        #   * no dangling references in the metadata
        run: twine check --strict dist/*

      - name: List built artifacts
        run: ls -la dist/

      - name: Generate SLSA 3 build provenance attestation
        uses: actions/attest-build-provenance@v2
        # Generates a sigstore-signed SLSA Provenance v1.0 attestation
        # covering every file in dist/. The attestation lands in
        # GitHub's attestation store + the public Rekor transparency log.
        # Verifiable via:
        #
        #   gh attestation verify dist/ophamin-X.Y.Z-py3-none-any.whl \
        #       --owner IdirBenSlama
        #
        # See docs/RELEASE_PROCEDURE.md §4.6 for the full verification
        # walkthrough.
        with:
          subject-path: "dist/*"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ophamin-dist
          path: dist/
          retention-days: 30

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Publish only when triggered by a v* tag push, OR a manual dispatch
    # with dry_run=false. The dry-run path stops at `build` above.
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true')
    # PyPI Trusted Publishing is owner-side configuration (one-time setup at
    # https://pypi.org/manage/account/publishing/ for the `ophamin` project).
    # Until the pending publisher is registered, this step fails with
    # `invalid-publisher` — the artifact uploaded by the `build` job above
    # is the source of truth meanwhile. Once owner-side setup is complete,
    # revert this `continue-on-error` so future publish regressions fail
    # loud (same pattern as the 0.8.4 → 0.8.5 docs-deploy gate flip).
    continue-on-error: true
    environment:
      name: pypi
      url: https://pypi.org/project/ophamin/
    # `id-token: write` is REQUIRED for Trusted Publishing — it's the OIDC
    # claim that lets PyPI verify the workflow's identity without an API
    # token sitting in repo secrets.
    permissions:
      id-token: write
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v6
        with:
          name: ophamin-dist
          path: dist/

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` field — Trusted Publishing means PyPI mints a
        # short-lived token from the OIDC claim above. Long-lived tokens
        # in repo secrets are explicitly avoided per RFC 0002 §3.1 Phase E6.
        #
        # `attestations: true` — RFC 0002 §3.1 Phase E7. Tells the
        # action to generate PEP 740 attestations for each artefact and
        # upload them to PyPI alongside the package. Downstream consumers
        # can verify install-time provenance via
        # `pip install ophamin --verify-attestations`. This is
        # orthogonal to the SLSA 3 attestation the `build` job emitted
        # — that lives in GitHub's attestation store + Rekor; PEP 740
        # attestations live in PyPI's index alongside the .whl/.tar.gz.
        with:
          packages-dir: dist/
          attestations: true
          # `verbose` is useful for diagnosing first-publish issues
          # (most common: pending publisher not yet set up on PyPI side).
          verbose: true
