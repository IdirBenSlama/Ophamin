name: chart

# Build the Ophamin Helm chart (charts/ophamin/) and publish to GHCR as
# an OCI artifact. Operators install via:
#   helm install my-ophamin oci://ghcr.io/idirbenslama/ophamin \
#     --version <chart-version>
#
# Plus a per-PR helm-lint job that catches schema-level chart errors
# the structural Python tests (tests/test_helm_chart.py) can't see.
#
# Triggers:
#   - push to main         → helm-lint runs (validates the chart change)
#   - tag push v*          → helm-lint + publish chart to GHCR
#   - workflow_dispatch    → manual trigger (for testing the workflow)
#   - pull_request         → helm-lint only (catches drift before merge)
#
# What this workflow IS / IS NOT:
#   - Publishes the Helm chart at charts/ophamin/ as an OCI artifact
#   - Validates chart schema via `helm lint`
#   - Does NOT publish the Docker image (that's docker.yml)
#   - Does NOT bump the chart version automatically (operator does that
#     in Chart.yaml before tagging)
#
# Pull recipes after publish:
#   helm show chart oci://ghcr.io/idirbenslama/ophamin --version 0.1.0
#   helm install my-ophamin oci://ghcr.io/idirbenslama/ophamin \
#       --version 0.1.0 --namespace ophamin --create-namespace

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/chart.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # required to push to ghcr.io
  id-token: write  # for future cosign / sigstore chart signing

# Single in-flight build per ref — newer pushes replace older.
concurrency:
  group: chart-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Chart pushes to oci://<registry>/<repo-owner-lowercased> — Helm
  # creates the per-chart subpath automatically based on Chart.yaml's
  # `name:` field. The repo-owner segment must be lowercase (same
  # lesson as the docker.yml 0.35.1 fix).
  CHART_DIR: charts/ophamin

jobs:
  helm-lint:
    name: helm lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: helm lint charts/ophamin
        run: |
          helm lint "$CHART_DIR"

      - name: helm template charts/ophamin (default values)
        # Smoke-test that the templates render with default values.
        # Catches the most common template-syntax errors that `lint`
        # doesn't fire on.
        run: |
          helm template my-ophamin "$CHART_DIR" --debug \
            > /tmp/rendered-default.yaml
          echo "--- Rendered (default) line count: $(wc -l < /tmp/rendered-default.yaml)"

      - name: helm template with mcp enabled + ingress enabled
        # Exercise the opt-in code paths once per change.
        run: |
          helm template my-ophamin "$CHART_DIR" \
            --set mcp.enabled=true \
            --set ingress.enabled=true \
            --set ingress.hosts[0].host=test.example.com \
            --set ingress.hosts[0].paths[0].path=/ \
            --set ingress.hosts[0].paths[0].pathType=Prefix \
            --set ingress.hosts[0].paths[0].service=http \
            --debug \
            > /tmp/rendered-mcp-ingress.yaml
          echo "--- Rendered (mcp+ingress) line count: $(wc -l < /tmp/rendered-mcp-ingress.yaml)"

      - name: helm template with autoscaling enabled
        run: |
          helm template my-ophamin "$CHART_DIR" \
            --set autoscaling.enabled=true \
            --debug \
            > /tmp/rendered-hpa.yaml
          echo "--- Rendered (hpa) line count: $(wc -l < /tmp/rendered-hpa.yaml)"

      - name: helm template with NetworkPolicy enabled
        # 0.45.0 — exercises the new NetworkPolicy template's opt-in path
        # so any future schema drift in templates/networkpolicy.yaml
        # surfaces at PR time instead of post-install.
        run: |
          helm template my-ophamin "$CHART_DIR" \
            --set networkPolicy.enabled=true \
            --debug \
            > /tmp/rendered-netpol.yaml
          echo "--- Rendered (netpol) line count: $(wc -l < /tmp/rendered-netpol.yaml)"
          # Confirm the NetworkPolicy resource is actually present
          # (catches the case where the conditional accidentally evaluates
          # to false even when networkPolicy.enabled=true).
          grep -q 'kind: NetworkPolicy' /tmp/rendered-netpol.yaml \
            || { echo "::error::NetworkPolicy template did not render"; exit 1; }

  publish:
    name: publish chart to GHCR
    # Publish on:
    #   - push to main                 → tag the chart with branch name
    #   - tag push v*                  → use the chart's Chart.yaml version
    #   - workflow_dispatch            → use the chart's Chart.yaml version
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    needs: helm-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Compute lowercase OCI namespace
        id: oci
        # Same lesson as docker.yml — OCI refs must be lowercase but
        # GitHub returns the original-case repo name. Lowercase the
        # owner segment (the chart name comes from Chart.yaml,
        # already lowercase by convention).
        run: |
          OWNER="${{ github.repository_owner }}"
          echo "namespace=${OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login "$REGISTRY" \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: helm package
        id: package
        run: |
          mkdir -p /tmp/chart-out
          helm package "$CHART_DIR" --destination /tmp/chart-out
          CHART_TGZ=$(ls /tmp/chart-out/*.tgz | head -1)
          echo "tgz=$CHART_TGZ" >> "$GITHUB_OUTPUT"
          echo "Packaged: $CHART_TGZ"

      - name: helm push to GHCR
        # Pushes to oci://ghcr.io/<owner-lowercase>/<chart-name>:<version>
        # The chart-name segment comes from Chart.yaml's `name:` field.
        # Captures stderr so the next step can extract the digest for
        # cosign signing — `helm push` doesn't expose the digest as a
        # step output, but it does print it to stderr in the form
        #   Pushed: ghcr.io/<ns>/ophamin:<version>
        #   Digest: sha256:<hex>
        id: push
        run: |
          set -o pipefail
          helm push "${{ steps.package.outputs.tgz }}" \
            "oci://${REGISTRY}/${{ steps.oci.outputs.namespace }}" \
            2>&1 | tee /tmp/helm-push.log
          DIGEST=$(grep -oE 'Digest: sha256:[a-f0-9]+' /tmp/helm-push.log | head -1 | awk '{print $2}')
          PUSHED_REF=$(grep -oE 'Pushed: [^ ]+' /tmp/helm-push.log | head -1 | awk '{print $2}')
          if [ -z "$DIGEST" ] || [ -z "$PUSHED_REF" ]; then
            echo "::error::Could not parse digest or ref from helm push output"
            cat /tmp/helm-push.log
            exit 1
          fi
          # Strip the :tag suffix so we can re-attach the @digest form
          REF_NO_TAG="${PUSHED_REF%:*}"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "ref_no_tag=$REF_NO_TAG" >> "$GITHUB_OUTPUT"
          echo "Parsed digest: $DIGEST"
          echo "Parsed ref:    $REF_NO_TAG"

      # ── Sigstore / cosign keyless signing ────────────────────────────────
      # Signs the published chart with a short-lived Fulcio cert tied to
      # this workflow's OIDC identity. Same supply-chain story as
      # docker.yml — signature lands in GHCR as a sibling OCI artifact +
      # in the public Rekor transparency log.
      #
      # Consumer verification:
      #   cosign verify ghcr.io/idirbenslama/ophamin/ophamin@<digest> \
      #     --certificate-identity-regexp='^https://github.com/IdirBenSlama/Ophamin/.*' \
      #     --certificate-oidc-issuer=https://token.actions.githubusercontent.com
      #
      # See docs/SUPPLY_CHAIN.md for the full verification flow.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign chart with cosign (keyless)
        id: sign
        run: |
          DIGEST="${{ steps.push.outputs.digest }}"
          REF_NO_TAG="${{ steps.push.outputs.ref_no_tag }}"
          # Re-login as `crane` since cosign uses the same registry
          # credential set helm just authenticated against — but in a
          # fresh subprocess, so we have to re-auth here.
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | cosign login "$REGISTRY" \
                --username "${{ github.actor }}" \
                --password-stdin
          CHART_DIGEST_REF="${REF_NO_TAG}@${DIGEST}"
          echo "Signing $CHART_DIGEST_REF"
          cosign sign --yes "$CHART_DIGEST_REF"
          echo "chart_ref=$CHART_DIGEST_REF" >> "$GITHUB_OUTPUT"

      # ── Self-verify the freshly-published chart signature ───────────────
      # Same shape as docker.yml's self-verify step — catches signing-
      # pipeline drift in the same run rather than waiting for an external
      # consumer. The certificate-identity regex pins this workflow's
      # identity; chart-yml renames or ref-pattern changes would fail loud
      # here.
      - name: Self-verify the chart signature
        run: |
          CHART_REF="${{ steps.sign.outputs.chart_ref }}"
          echo "Self-verifying $CHART_REF"
          cosign verify "$CHART_REF" \
            --certificate-identity-regexp='^https://github\.com/IdirBenSlama/Ophamin/\.github/workflows/chart\.yml@.*' \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            > /tmp/cosign-verify-chart.json
          echo "Verify output bytes: $(wc -c < /tmp/cosign-verify-chart.json)"
          jq -e '.[] | .critical.identity.docker-reference' /tmp/cosign-verify-chart.json \
              > /dev/null \
              || { echo "::error::cosign verify output unexpected shape"; cat /tmp/cosign-verify-chart.json; exit 1; }
          echo "OK — chart signature verifies against this workflow's identity"

      - name: Report published chart
        if: always()
        run: |
          echo "## Published Helm chart" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "oci://${REGISTRY}/${{ steps.oci.outputs.namespace }}/ophamin" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.push.outputs.digest }}" ]; then
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo "**Digest:** \`${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo "Signed via cosign keyless (Sigstore) — see docs/SUPPLY_CHAIN.md for verification." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Install with:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "helm install my-ophamin oci://${REGISTRY}/${{ steps.oci.outputs.namespace }}/ophamin" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
