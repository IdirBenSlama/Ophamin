name: self-test

# Ophamin dogfoods itself. The substrate-free scenarios (statistical
# crosschecks + measurement-machinery validators + the Bayesian Φ
# posterior on synthetic data) run against the framework via
# `ophamin self-test`, producing one signed EmpiricalProofRecord
# bundle per scenario under proofs/ophamin-self/.
#
# The job:
#   1. Runs `ophamin self-test --proofs-root proofs/ophamin-self`
#   2. Exits non-zero if any scenario is REFUTED (CI fails-fast)
#   3. Uploads the bundle tree as an artifact whether the run
#      passed or failed — the REFUTED bundles are the most useful
#      ones to inspect when a scenario regresses.
#
# Trigger shape: every push to main + every PR + manual dispatch.
# Lightweight (no SonarQube container, no heavy ML deps) so it can
# run on every commit without slowing down the pipeline.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  self-test:
    name: ophamin self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ophamin
        run: |
          python -m pip install --upgrade pip
          # property_test extra is enough for the dogfood scenarios —
          # they don't need the heavy ML stack.
          pip install -e ".[property_test]"

      - name: Install LaTeX toolchain (for PDF renders)
        run: |
          # We want the full bundle (incl. proof.pdf) so the bundle
          # tree the GUI browses is complete. Proof statements carry raw
          # Greek + math Unicode (μ, σ, Φ, ≤, …), so we need:
          #   - texlive-xetex     : xelatex, the Unicode-native engine the
          #                         PDF renderer prefers (typesets Greek
          #                         natively instead of hard-failing).
          #   - texlive-latex-extra: newunicodechar, which the .tex preamble
          #                         loads to map Greek/math codepoints to
          #                         math-font commands (used under BOTH
          #                         xelatex and the pdflatex fallback).
          # fontspec / iftex / amsfonts ship with the recommended/base sets.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              texlive-latex-base texlive-latex-recommended \
              texlive-fonts-recommended texlive-latex-extra \
              texlive-xetex latexmk

      - name: Run self-test (writes signed bundles)
        id: selftest
        run: |
          # Exit code = number of REFUTED scenarios. CI fails-fast on
          # any regression in the substrate-free statistical pillars.
          # Pick the venv binary if it materialised, else the process-wide
          # install (the pip step installs into the runner's Python, so
          # .venv/bin/ophamin usually does NOT exist here). Run exactly ONE
          # invocation so the step's exit code IS the self-test's own — the
          # previous form probed .venv/bin/ophamin first, which 127s when
          # absent and left a stale EXIT=127 that the successful fallback
          # never cleared (turning a refuted=0 pass into a 127 failure).
          if [ -x .venv/bin/ophamin ]; then
              OPHAMIN=.venv/bin/ophamin
          else
              OPHAMIN=ophamin
          fi
          "$OPHAMIN" self-test --proofs-root proofs/ophamin-self

      - name: Surface self-test result in step summary
        # Always runs (even on REFUTED) so the PR view shows the
        # per-scenario outcome without the operator opening the
        # artifact.
        if: always()
        run: |
          {
              echo "## Ophamin self-test result"
              echo ""
              echo "Bundles written to: \`proofs/ophamin-self/\`"
              echo ""
              # List bundle dirs in a compact table
              echo '| Tier | Scenario | Verdict | Hash |'
              echo '|---|---|---|---|'
              for d in proofs/ophamin-self/*/*/; do
                  tier=$(basename "$(dirname "$(dirname "$d")")")
                  scenario=$(basename "$(dirname "$d")")
                  for bundle in "$d"*/; do
                      [ -d "$bundle" ] || continue
                      name=$(basename "$bundle")
                      verdict=$(echo "$name" | cut -d_ -f2)
                      hash=$(echo "$name" | cut -d_ -f3)
                      echo "| $tier | $scenario | $verdict | \`$hash\` |"
                  done
              done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed self-test bundle tree
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ophamin-self-test-${{ github.sha }}
          path: proofs/ophamin-self/**
          retention-days: 90
          if-no-files-found: error
