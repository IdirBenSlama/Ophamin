name: CI

# Runs on every push to main and every pull request. Cancels superseded
# runs on the same branch to keep free-tier minutes economical.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test on the Python versions in pyproject's requires-python band.
        # 3.12 is the canonical target; 3.13 catches the next stable release.
        # Add 3.10/3.11 back if older-version compatibility becomes a goal.
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # full-feature install — every extra Ophamin needs to run end-to-end
          pip install -e ".[all,dev]"

      - name: Verify install (every required dep + audit binary present)
        env:
          PYTHONPATH: src
        run: python -m ophamin.cli verify

      - name: Run pytest
        env:
          PYTHONPATH: src
        run: pytest -q

  lint:
    name: lint (ruff + bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff>=0.4 bandit>=1.7

      - name: ruff check
        # don't fail the build on existing findings — surface them in the log
        # for awareness, gate on real regressions in a follow-on (a baseline
        # ratchet workflow can be added once we agree on the floor)
        continue-on-error: true
        run: ruff check src tests

      - name: bandit security scan
        continue-on-error: true
        run: bandit -r src/ophamin -q
