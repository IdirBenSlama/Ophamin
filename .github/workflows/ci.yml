name: CI

# Runs on every push to main and every pull request. Cancels superseded
# runs on the same branch to keep free-tier minutes economical.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Windows is surfaced as ADVISORY (allow-failure) per matrix.experimental.
    # See the per-entry comment block below for the rationale.
    continue-on-error: ${{ matrix.experimental == true }}
    # Cap each job at 45 minutes. The non-Windows jobs run in ~15-20 min;
    # the Windows job may hit slow pip-install on optional-deps wheels.
    # 45 min is safely above the green-path timing without burning a
    # full hour per run if Windows hangs.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Test on the Python versions in pyproject's requires-python band.
        # 3.12 is the canonical target; 3.13 catches the next stable release.
        # macOS is included on Python 3.12 only to catch platform-specific
        # path / wheel / encoding regressions without quadrupling cost.
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]
        experimental: [false]
        include:
          - os: macos-latest
            python-version: "3.12"
            experimental: false
          # Windows added 2026-05-19 as ADVISORY (continue-on-error via the
          # matrix.experimental flag). Subprocess-path code historically used
          # POSIX conventions (path separators, /tmp, /dev/null) that aren't
          # portable; running on Windows surfaces which assumptions still
          # need explicit shims. Failures here are findings, not gating
          # regressions — the build proceeds. Ratchet to non-experimental
          # once the Windows-portability sweep closes.
          - os: windows-latest
            python-version: "3.12"
            experimental: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # full-feature install — every extra Ophamin needs to run end-to-end,
          # PLUS property_test so the bench / coverage / hypothesis tooling
          # is available for the dedicated jobs below.
          pip install -e ".[all,dev,property_test]"

      - name: Verify install (every required dep + audit binary present)
        env:
          PYTHONPATH: src
        run: python -m ophamin.cli verify

      - name: Run pytest with coverage gate
        env:
          PYTHONPATH: src
        # Coverage threshold = 75 %: the honest cross-platform floor on
        # clean Ubuntu CI (matched against ``pip install -e .[all,dev,
        # property_test]``). Locally on the author's macOS box the
        # number is ~78 % because the venv has additional optional deps
        # (NPEET / pacmap / etc.) installed from earlier sessions that
        # add reachable code paths. The CI floor is the authoritative
        # cross-platform measurement; ratcheting toward 85 % is tracked
        # in BENCHMARKS_AND_COVERAGE.md.
        run: |
          pytest -q --ignore=tests/bench \
            --cov=src/ophamin --cov-branch --cov-fail-under=75 \
            --cov-report=xml --cov-report=term:skip-covered

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-ubuntu-py3.12
          path: coverage.xml
          retention-days: 14

  typecheck:
    name: typecheck (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: mypy --strict (full package)
        env:
          PYTHONPATH: src
        # Phase S1 closed 2026-05-16: every source file is strict-clean.
        # Any new strict-mode regression fails the build.
        run: mypy --strict src/ophamin

  audit:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    # Don't fail the build on a new CVE — the audit pillar is the
    # tracking surface. CVEs that aren't already in
    # `docs/RISK_ACCEPTED_CVES.md` trigger a follow-up; CVEs that are
    # documented + suppressed don't gate ship.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[audit]"

      - name: Run pip-audit against the install
        # ``--ignore-vuln`` carries every CVE documented in
        # docs/RISK_ACCEPTED_CVES.md. Update both files together.
        run: |
          pip-audit \
            --ignore-vuln CVE-2025-69872 \
            --ignore-vuln PYSEC-2022-42969

  lint:
    name: lint (ruff + bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff>=0.4 bandit>=1.7

      - name: ruff check
        # don't fail the build on existing findings — surface them in the log
        # for awareness, gate on real regressions in a follow-on (a baseline
        # ratchet workflow can be added once we agree on the floor)
        continue-on-error: true
        run: ruff check src tests

      - name: bandit security scan
        continue-on-error: true
        run: bandit -r src/ophamin -q
