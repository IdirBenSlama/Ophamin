name: docker

# Build the Ophamin CORE image (per Dockerfile) and publish to GHCR.
# Per `docs/TOOL_LANDSCAPE_2026_05_19.md` Tier-4 #5: operators wanting
# `ophamin http serve` or `ophamin mcp serve` in K8s shouldn't have
# to build locally.
#
# Triggers:
#   - tag push v*    → image tagged with the version (e.g. 0.33.1) + latest
#   - push to main   → image tagged 'main' (so 'docker pull ghcr.io/.../ophamin:main'
#                      always grabs the bleeding edge for testing)
#   - workflow_dispatch — manual trigger (for testing the workflow itself)
#
# What the image IS / IS NOT (mirrors Dockerfile's scope-note block):
#   - CORE runtime + CLI (`ophamin scenario list`, `ophamin http serve`,
#     `ophamin schema validate`, etc.)
#   - NO optional extras (no [causal] / [bayesian] / [tda] / [audit] etc.)
#     The image is intentionally slim; consumers needing extras install
#     them locally on a build-tool-equipped host.
#
# Pull the image:
#   docker pull ghcr.io/idirbenslama/ophamin:0.33.1
#   docker pull ghcr.io/idirbenslama/ophamin:latest
#   docker pull ghcr.io/idirbenslama/ophamin:main
#
# Smoke-test:
#   docker run --rm ghcr.io/idirbenslama/ophamin:latest --help

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write       # required to push to ghcr.io
  id-token: write       # cosign / sigstore keyless signing (0.42.0+)
  attestations: write   # actions/attest-build-provenance@v2 SLSA writer (0.49.0+)

# Single in-flight build per ref — replacing the in-progress build when
# a fresh push lands is fine for the image-publishing workflow.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: build + push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker registry refs MUST be lowercase, but ${{ github.repository }}
      # carries the original-case GitHub repo name (e.g. "IdirBenSlama/Ophamin").
      # docker/metadata-action lowercases automatically for the tags it
      # emits, but cache-from / cache-to / smoke-test pull paths that we
      # template ourselves need explicit lowercasing or buildx fails with
      # "invalid reference format: repository name must be lowercase".
      - name: Compute lowercase image name
        id: image
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tags:
          #   - v0.33.1 tag push  → 0.33.1 + latest
          #   - main branch push  → main
          #   - manual dispatch   → dispatch-<sha-prefix>
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dispatch-${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHCR caching via the registry — speeds up incremental builds
          # without leaking artifacts to a third-party registry.
          # Lowercased image name — see "Compute lowercase image name" step.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache,mode=max
          # Multi-arch: linux/amd64 + linux/arm64. The Dockerfile
          # comment-notes that some optional wheels don't have arm64
          # builds, but the core image doesn't install those — base
          # python:3.12.7-slim-bookworm + core deps work on both arches.
          platforms: linux/amd64,linux/arm64

      - name: Smoke-test pushed image
        # Pull one of the freshly-pushed tags and verify the entrypoint
        # produces help text. Catches the case where build succeeds but
        # the image fails to start (entrypoint regression, missing dep).
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ github.sha }}"
          # If push didn't tag with sha (semver path), fall back to main
          # or version-derived tag.
          if ! docker pull "$IMAGE" 2>/dev/null; then
            FIRST_TAG=$(echo '${{ steps.meta.outputs.tags }}' | head -1)
            IMAGE="$FIRST_TAG"
          fi
          echo "Smoke-testing image: $IMAGE"
          docker run --rm "$IMAGE" --help | head -5

      # ── Sigstore / cosign keyless signing ────────────────────────────────
      # Signs the pushed image with a short-lived Fulcio cert tied to this
      # workflow's OIDC identity. The signature lands in GHCR as a sibling
      # OCI artifact AND in the public Rekor transparency log.
      #
      # Consumer verification:
      #   cosign verify ghcr.io/idirbenslama/ophamin@<digest> \
      #     --certificate-identity-regexp='^https://github.com/IdirBenSlama/Ophamin/.*' \
      #     --certificate-oidc-issuer=https://token.actions.githubusercontent.com
      #
      # See docs/SUPPLY_CHAIN.md for the full verification flow.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign image with cosign (keyless)
        # The buildx push produces ONE multi-arch manifest at the digest;
        # cosign signs that root manifest, transitively covering both
        # linux/amd64 and linux/arm64 variants. Using --yes skips the
        # interactive consent prompt that cosign would otherwise show.
        id: sign
        run: |
          DIGEST="${{ steps.build-and-push.outputs.digest }}"
          if [ -z "$DIGEST" ]; then
            echo "::error::build-and-push step did not export a digest"
            exit 1
          fi
          IMAGE_REF="${REGISTRY}/${{ steps.image.outputs.name }}@${DIGEST}"
          echo "Signing $IMAGE_REF"
          cosign sign --yes "$IMAGE_REF"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      # ── Self-verify the freshly-published signature ──────────────────────
      # Catches signing-pipeline drift IMMEDIATELY rather than waiting for
      # an external consumer to run `cosign verify` later. If the
      # certificate-identity regex stops matching this workflow's identity
      # (e.g. workflow file renamed, ref pattern changed), this step fails
      # loud — closing the gap 0.42.0's CHANGELOG flagged.
      #
      # The verify uses the same Sigstore Fulcio + Rekor endpoints as the
      # consumer-side command documented in docs/SUPPLY_CHAIN.md, so any
      # consumer running that command should produce the same green output.
      - name: Self-verify the signature
        run: |
          IMAGE_REF="${{ steps.sign.outputs.image_ref }}"
          echo "Self-verifying $IMAGE_REF"
          cosign verify "$IMAGE_REF" \
            --certificate-identity-regexp='^https://github\.com/IdirBenSlama/Ophamin/\.github/workflows/docker\.yml@.*' \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            > /tmp/cosign-verify-output.json
          echo "Verify output bytes: $(wc -c < /tmp/cosign-verify-output.json)"
          # Sanity-check the verify output has the expected shape — cosign
          # exits non-zero on verify failure, so reaching this means the
          # signature was found AND the cert identity matched. The bracket
          # syntax for "docker-reference" is required because the hyphen
          # makes the dot-syntax form parse as the `reference/0` operator
          # (jq language quirk).
          jq -e '.[] | .critical.identity["docker-reference"]' /tmp/cosign-verify-output.json \
              > /dev/null \
              || { echo "::error::cosign verify output unexpected shape"; cat /tmp/cosign-verify-output.json; exit 1; }
          echo "OK — signature verifies against this workflow's identity"

      # ── SBOM generation + attestation (0.48.0) ───────────────────────────
      # Generates a CycloneDX SBOM of the published image's contents via
      # Anchore syft, then attaches it as a typed in-toto attestation
      # (predicate-type: cyclonedx) signed via cosign keyless. The
      # attestation lands in the same OCI registry as the image + Rekor.
      #
      # Consumer recipe (see docs/SUPPLY_CHAIN.md):
      #   cosign verify-attestation ghcr.io/idirbenslama/ophamin@<digest> \
      #     --type cyclonedx \
      #     --certificate-identity-regexp='^https://github\.com/IdirBenSlama/Ophamin/.*' \
      #     --certificate-oidc-issuer=https://token.actions.githubusercontent.com
      - name: Generate SBOM via syft
        uses: anchore/sbom-action@v0
        with:
          # syft scans the actually-published image (image-level SBOM
          # — includes the python:3.12-slim base layer + pip-installed
          # packages). Far more accurate than scanning the source tree.
          image: ${{ steps.sign.outputs.image_ref }}
          format: cyclonedx-json
          output-file: /tmp/sbom.cdx.json
          # Don't upload as a dependency-graph artifact (separate path);
          # we attach as a typed attestation below.
          dependency-snapshot: false

      - name: Attest SBOM with cosign (CycloneDX predicate)
        # `cosign attest --type cyclonedx` produces an in-toto Statement v1
        # attestation with the SBOM as the typed predicate. The attestation
        # is signed via Sigstore keyless (same flow as cosign sign).
        # Lands in GHCR as a sibling OCI artifact + Rekor entry.
        run: |
          IMAGE_REF="${{ steps.sign.outputs.image_ref }}"
          echo "Attesting CycloneDX SBOM for $IMAGE_REF"
          cosign attest --yes \
            --type cyclonedx \
            --predicate /tmp/sbom.cdx.json \
            "$IMAGE_REF"

      - name: Self-verify the SBOM attestation
        # Same pattern as the image-signature self-verify — catch
        # attestation-pipeline drift in the same run rather than waiting
        # for an external consumer.
        run: |
          IMAGE_REF="${{ steps.sign.outputs.image_ref }}"
          echo "Self-verifying SBOM attestation on $IMAGE_REF"
          cosign verify-attestation "$IMAGE_REF" \
            --type cyclonedx \
            --certificate-identity-regexp='^https://github\.com/IdirBenSlama/Ophamin/\.github/workflows/docker\.yml@.*' \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            > /tmp/cosign-attest-verify.json
          ATTEST_BYTES=$(wc -c < /tmp/cosign-attest-verify.json)
          echo "Attestation verify output bytes: $ATTEST_BYTES"
          if [ "$ATTEST_BYTES" -lt 100 ]; then
              echo "::error::attestation verify output suspiciously small"
              cat /tmp/cosign-attest-verify.json
              exit 1
          fi
          echo "OK — SBOM attestation verifies against this workflow's identity"

      # ── SLSA L3 provenance attestation (0.49.0) ─────────────────────────
      # Closes the supply-chain provenance loop:
      #   - "what's inside the image" → 0.48.0 CycloneDX SBOM attestation
      #   - "how was it built"        → 0.49.0 SLSA L3 provenance attestation
      #
      # GitHub's native `actions/attest-build-provenance@v2` action
      # produces SLSA v1.0 provenance with builder info + materials
      # (source repo + commit + workflow URI) + invocation metadata.
      # Signed via the same Sigstore keyless flow as cosign sign and
      # cosign attest. The attestation lands in BOTH GitHub's
      # attestation registry (`gh attestation verify`) AND Sigstore's
      # Rekor (cosign verify-attestation).
      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          # `push-to-registry: true` writes the attestation as a sibling
          # OCI artifact on the same registry as the image — same
          # storage path as the cosign attestations from 0.42.0 + 0.48.0.
          # Operators get both the GitHub-native `gh attestation verify`
          # path AND the registry-resident `cosign verify-attestation`
          # path against the same signed claim.
          push-to-registry: true

      - name: Self-verify the SLSA provenance attestation
        # Verify via the `gh attestation verify` CLI — the canonical
        # tool for attestations produced by actions/attest-build-
        # provenance@v2.
        #
        # The 0.49.0 first-run discovered that
        # `cosign verify-attestation --type slsaprovenance1` doesn't find
        # the attestation because actions/attest-build-provenance writes
        # in sigstore-bundle format (the GitHub-native attestation
        # registry shape) which cosign's --type filter doesn't map to.
        #
        # The 0.49.1 second-run discovered that `gh attestation verify`
        # produces NO stdout/stderr by default when running outside a
        # TTY — my grep-based sanity-check failed even though the verify
        # succeeded. Fix: use `--format json` (forces machine-readable
        # output regardless of TTY) and trust the exit code (gh exits
        # non-zero on verification failure, so under bash -e an
        # unverified attestation kills the step).
        #
        # The cosign verify-attestation path documented in
        # docs/SUPPLY_CHAIN.md remains valid for consumers who prefer it
        # — but the CI self-verify uses gh as the canonical path.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE_REF="${{ steps.sign.outputs.image_ref }}"
          echo "Self-verifying SLSA provenance attestation on $IMAGE_REF"
          # `--format json` forces JSON output regardless of TTY state.
          # gh attestation verify exits non-zero on failure → bash -e
          # kills the step. Reaching the next line means SUCCESS.
          gh attestation verify "oci://$IMAGE_REF" \
            --repo "${{ github.repository }}" \
            --predicate-type=https://slsa.dev/provenance/v1 \
            --format json \
            > /tmp/gh-slsa-verify.json
          BYTES=$(wc -c < /tmp/gh-slsa-verify.json)
          echo "gh attestation verify output bytes: $BYTES"
          if [ "$BYTES" -lt 50 ]; then
              echo "::error::gh attestation verify output suspiciously small"
              cat /tmp/gh-slsa-verify.json
              exit 1
          fi
          # Sanity-check the JSON parses + contains an attestation
          jq -e 'length > 0' /tmp/gh-slsa-verify.json > /dev/null \
              || { echo "::error::gh attestation verify JSON contains no attestations"; cat /tmp/gh-slsa-verify.json; exit 1; }
          echo "OK — SLSA provenance verifies via gh attestation verify"

      - name: Report image digest
        if: always()
        run: |
          echo "## Pushed image tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.meta.outputs.tags }}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
