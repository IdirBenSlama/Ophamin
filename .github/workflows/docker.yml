name: docker

# Build the Ophamin CORE image (per Dockerfile) and publish to GHCR.
# Per `docs/TOOL_LANDSCAPE_2026_05_19.md` Tier-4 #5: operators wanting
# `ophamin http serve` or `ophamin mcp serve` in K8s shouldn't have
# to build locally.
#
# Triggers:
#   - tag push v*    → image tagged with the version (e.g. 0.33.1) + latest
#   - push to main   → image tagged 'main' (so 'docker pull ghcr.io/.../ophamin:main'
#                      always grabs the bleeding edge for testing)
#   - workflow_dispatch — manual trigger (for testing the workflow itself)
#
# What the image IS / IS NOT (mirrors Dockerfile's scope-note block):
#   - CORE runtime + CLI (`ophamin scenario list`, `ophamin http serve`,
#     `ophamin schema validate`, etc.)
#   - NO optional extras (no [causal] / [bayesian] / [tda] / [audit] etc.)
#     The image is intentionally slim; consumers needing extras install
#     them locally on a build-tool-equipped host.
#
# Pull the image:
#   docker pull ghcr.io/idirbenslama/ophamin:0.33.1
#   docker pull ghcr.io/idirbenslama/ophamin:latest
#   docker pull ghcr.io/idirbenslama/ophamin:main
#
# Smoke-test:
#   docker run --rm ghcr.io/idirbenslama/ophamin:latest --help

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # required to push to ghcr.io
  id-token: write  # for future cosign / sigstore signing

# Single in-flight build per ref — replacing the in-progress build when
# a fresh push lands is fine for the image-publishing workflow.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: build + push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker registry refs MUST be lowercase, but ${{ github.repository }}
      # carries the original-case GitHub repo name (e.g. "IdirBenSlama/Ophamin").
      # docker/metadata-action lowercases automatically for the tags it
      # emits, but cache-from / cache-to / smoke-test pull paths that we
      # template ourselves need explicit lowercasing or buildx fails with
      # "invalid reference format: repository name must be lowercase".
      - name: Compute lowercase image name
        id: image
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tags:
          #   - v0.33.1 tag push  → 0.33.1 + latest
          #   - main branch push  → main
          #   - manual dispatch   → dispatch-<sha-prefix>
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dispatch-${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHCR caching via the registry — speeds up incremental builds
          # without leaking artifacts to a third-party registry.
          # Lowercased image name — see "Compute lowercase image name" step.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:buildcache,mode=max
          # Multi-arch: linux/amd64 + linux/arm64. The Dockerfile
          # comment-notes that some optional wheels don't have arm64
          # builds, but the core image doesn't install those — base
          # python:3.12.7-slim-bookworm + core deps work on both arches.
          platforms: linux/amd64,linux/arm64

      - name: Smoke-test pushed image
        # Pull one of the freshly-pushed tags and verify the entrypoint
        # produces help text. Catches the case where build succeeds but
        # the image fails to start (entrypoint regression, missing dep).
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ github.sha }}"
          # If push didn't tag with sha (semver path), fall back to main
          # or version-derived tag.
          if ! docker pull "$IMAGE" 2>/dev/null; then
            FIRST_TAG=$(echo '${{ steps.meta.outputs.tags }}' | head -1)
            IMAGE="$FIRST_TAG"
          fi
          echo "Smoke-testing image: $IMAGE"
          docker run --rm "$IMAGE" --help | head -5

      # ── Sigstore / cosign keyless signing ────────────────────────────────
      # Signs the pushed image with a short-lived Fulcio cert tied to this
      # workflow's OIDC identity. The signature lands in GHCR as a sibling
      # OCI artifact AND in the public Rekor transparency log.
      #
      # Consumer verification:
      #   cosign verify ghcr.io/idirbenslama/ophamin@<digest> \
      #     --certificate-identity-regexp='^https://github.com/IdirBenSlama/Ophamin/.*' \
      #     --certificate-oidc-issuer=https://token.actions.githubusercontent.com
      #
      # See docs/SUPPLY_CHAIN.md for the full verification flow.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.1'

      - name: Sign image with cosign (keyless)
        # The buildx push produces ONE multi-arch manifest at the digest;
        # cosign signs that root manifest, transitively covering both
        # linux/amd64 and linux/arm64 variants. Using --yes skips the
        # interactive consent prompt that cosign would otherwise show.
        run: |
          DIGEST="${{ steps.build-and-push.outputs.digest }}"
          if [ -z "$DIGEST" ]; then
            echo "::error::build-and-push step did not export a digest"
            exit 1
          fi
          IMAGE_REF="${REGISTRY}/${{ steps.image.outputs.name }}@${DIGEST}"
          echo "Signing $IMAGE_REF"
          cosign sign --yes "$IMAGE_REF"

      - name: Report image digest
        if: always()
        run: |
          echo "## Pushed image tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.meta.outputs.tags }}' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
