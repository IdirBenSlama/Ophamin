# Dependabot configuration — free for all GitHub repos.
# Weekly version + security updates for both Python deps and GitHub Actions.
# https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # Python production + dev dependencies tracked via requirements files.
  # Dependabot reads pip-style requirements*.txt and pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    # major-version bumps go through manual review; auto-PR minor + patch only
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # --- Held packages (coupled-dependency / python-version blockers) ---
      # These are minor bumps Dependabot proposed that are NOT coherently
      # installable; held entirely until the blocker clears, then bump
      # manually as a coordinated PR. (Reverted on 2026-05-20 — see CHANGELOG.)
      #
      # dowhy 0.14+ requires Python <3.14, but the darwin lock targets
      # py314. Re-enable when dowhy restores py314 support.
      - dependency-name: "dowhy"
      # astroid 4.1.x has no compatible pylint yet — pylint 4.0.5 (latest)
      # caps astroid<=4.1.dev0. Coupled bump; re-enable when pylint 4.1 lands.
      - dependency-name: "astroid"
      # The opentelemetry-* packages are versioned in lockstep (core
      # 1.x.y + instrumentation 0.Nbx must match). Any single-package
      # bump (threading, otlp-proto-common, …) breaks the stack; bump
      # the whole otel set together in a manual PR instead.
      - dependency-name: "opentelemetry-*"
      # numba 0.64.1+ is capped by infomeasure (requires numba<0.64.1).
      # Coupled; re-enable when infomeasure lifts the cap or is dropped.
      - dependency-name: "numba"

  # GitHub Actions used in .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "actions"
      include: "scope"
