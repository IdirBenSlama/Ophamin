name: Bug report
description: Something in Ophamin behaved differently than documented or expected.
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please give us enough context
        to reproduce the behaviour — Ophamin's correctness depends on tight
        feedback loops, and a clear bug report is the first step.

  - type: input
    id: version
    attributes:
      label: Ophamin version / commit
      description: |
        Run `python -c "import ophamin; print(ophamin.__version__)"` AND
        `git rev-parse HEAD`. Paste both.
      placeholder: "0.1.0 @ 7afd98c"
    validations:
      required: true

  - type: dropdown
    id: wheel
    attributes:
      label: Affected wheel
      description: Which Ophamin wheel does this bug live in?
      multiple: false
      options:
        - "seeing/ (substrate / corpus / discovery)"
        - "measuring/ (proof / scenarios / pillars / metrics)"
        - "comparing/ (drift / provenance / orchestration)"
        - "instrumenting/"
        - "auditing/"
        - "reporting/"
        - "inspecting/"
        - "interop/"
        - "protocols / cli / config"
        - "other / unsure"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of the behaviour you observed.
    validations:
      required: true

  - type: textarea
    id: what-expected
    attributes:
      label: What did you expect to happen?
      description: A clear, concise description of the behaviour you expected.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: |
        Minimal, complete, reproducible. Include the exact CLI invocation,
        config, or Python snippet. If a fix requires a fixture or stimulus
        set, attach it.
      placeholder: |
        ```bash
        PYTHONPATH=src .venv/bin/python -m ophamin.cli audit src/ophamin
        # observed: <something>
        # expected: <something else>
        ```
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Output of:
          python --version
          pip freeze | head -10
          uname -a
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log / traceback
      description: Paste any traceback or log lines — feel free to trim noise.
      render: shell
    validations:
      required: false
