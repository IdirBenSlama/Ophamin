# Sonar Scanner configuration for analyzing Kimera-SWM via Ophamin's
# SonarQube stack. Place this file at the ROOT of the Kimera-SWM
# checkout you want to analyze (or pass via `sonar-scanner
# -Dproject.settings=<path>`); the scripts/sonar_scan.sh wrapper
# does the latter automatically when given a `--config` flag.
#
# Reference for Python-specific properties:
#   https://docs.sonarsource.com/sonarqube-server/latest/analyzing-source-code/languages/python/
#
# To run a scan from a Kimera-SWM checkout:
#   cd /path/to/Kimera_SWM
#   bash /path/to/Ophamin/scripts/sonar_scan.sh
#
# Or invoke sonar-scanner directly:
#   docker run --rm \
#       -v "$(pwd):/usr/src" \
#       -v "/path/to/this/file:/usr/src/sonar-project.properties" \
#       --network=host \
#       sonarsource/sonar-scanner-cli:latest

# ──────────────────────────────────────────────────────────────────────
# Project identity
# ──────────────────────────────────────────────────────────────────────

sonar.projectKey=kimera-swm
sonar.projectName=Kimera-SWM
sonar.projectVersion=auto

# ──────────────────────────────────────────────────────────────────────
# Server connection — defaults match the bundled docker-compose.yml.
# Override via `-Dsonar.host.url=...` if you point a different
# SonarQube instance.
# ──────────────────────────────────────────────────────────────────────

sonar.host.url=http://localhost:9000

# Auth token — generate one at:
#   http://localhost:9000/account/security
# Pass via env var SONAR_TOKEN (the scanner reads it), NOT inline here
# (don't bake credentials into shared config).
#
# The `scripts/sonar_scan.sh` wrapper picks SONAR_TOKEN from the
# environment.

# ──────────────────────────────────────────────────────────────────────
# Source + test layout
# ──────────────────────────────────────────────────────────────────────

# Production code lives under kimera_swm/ (3,800+ Python files at
# 2026-05-19 baseline).
sonar.sources=kimera_swm
sonar.python.version=3.12

# Test code lives under tests/ + kimera_swm/tests/.
# 1,459 Python test files at 2026-05-19 baseline.
sonar.tests=tests,kimera_swm/tests
sonar.test.inclusions=**/test_*.py,**/*_test.py

# Exclude bytecode + caches + generated artifacts + virtual envs +
# legacy archives. These add noise without informational value.
sonar.exclusions=\
    **/__pycache__/**,\
    **/*.pyc,\
    **/.venv/**,\
    **/venv/**,\
    **/.git/**,\
    **/.hypothesis/**,\
    **/.mypy_cache/**,\
    **/.pytest_cache/**,\
    **/.ruff_cache/**,\
    **/_archive/**,\
    **/_legacy_intake/**,\
    **/legacy/**,\
    **/build/**,\
    **/dist/**,\
    **/*.egg-info/**,\
    **/node_modules/**,\
    **/site/**,\
    **/Docs_v2/**,\
    **/docs/**,\
    **/experiments/observatory/runs/**,\
    **/traces/**,\
    **/proofs/**,\
    **/sbom/**

# Exclude tests from the duplication-detection pass (test files
# often have justified repetition — fixture setup, parametrize
# cases, similar assertion shapes — that isn't a real defect).
sonar.cpd.exclusions=**/test_*.py,**/*_test.py,**/conftest.py

# ──────────────────────────────────────────────────────────────────────
# Coverage report
# ──────────────────────────────────────────────────────────────────────
#
# SonarQube doesn't run tests; it consumes coverage output from
# coverage.py or pytest-cov. Generate the XML report BEFORE invoking
# the scanner:
#
#   pytest --cov=kimera_swm --cov-report=xml:coverage.xml
#
# scripts/sonar_scan.sh does this automatically when --with-coverage
# is passed.

sonar.python.coverage.reportPaths=coverage.xml

# ──────────────────────────────────────────────────────────────────────
# External-linter reports (optional, opt-in)
# ──────────────────────────────────────────────────────────────────────
#
# SonarQube can ingest reports from external linters and surface them
# as Sonar issues with the linter's original rule IDs. To enable, set
# the corresponding env var when invoking sonar-scanner:
#
#   sonar.python.ruff.reportPaths=ruff-report.json
#   sonar.python.bandit.reportPaths=bandit-report.json
#   sonar.python.mypy.reportPaths=mypy-report.txt
#
# Generate the reports first:
#   ruff check --output-format=sarif -o ruff-report.json kimera_swm/
#   bandit -r kimera_swm/ -f json -o bandit-report.json
#   mypy --strict kimera_swm/ > mypy-report.txt
#
# scripts/sonar_scan.sh supports each of these via --with-ruff / --with-bandit /
# --with-mypy flags.

# ──────────────────────────────────────────────────────────────────────
# Quality-gate configuration
# ──────────────────────────────────────────────────────────────────────
#
# Use the SonarQube web UI (http://localhost:9000/quality_gates) to
# define / customize quality gates. Defaults:
#   - 0 new bugs
#   - 0 new vulnerabilities
#   - 0 new security hotspots
#   - <= 3% new duplication
#   - >= 80% new-code coverage
#
# These thresholds apply to NEW code (after the project's new-code
# definition); historical code is reported but not gated.

# ──────────────────────────────────────────────────────────────────────
# Source encoding + verbosity
# ──────────────────────────────────────────────────────────────────────

sonar.sourceEncoding=UTF-8

# Disable the verbose scanner output unless debugging; the workflow's
# step summary captures the relevant numbers without the firehose.
# sonar.verbose=true
