<!DOCTYPE html>
<html lang="en" data-theme="dark" data-density="comfortable">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1440"/>
<title>Ophamin Console</title>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>

<link rel="stylesheet" href="app/styles.css"/>

<!-- Favicon: tiny six-wheels mark -->
<link rel="icon" type="image/svg+xml" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="6" fill="none" stroke="%232dd4bf" stroke-width="2" stroke-dasharray="20 18"/><circle cx="16" cy="16" r="10" fill="none" stroke="%232dd4bf" stroke-width="1.5" stroke-dasharray="30 30"/><circle cx="16" cy="16" r="14" fill="none" stroke="%232dd4bf" stroke-width="1" stroke-dasharray="40 50"/><circle cx="16" cy="16" r="2" fill="%232dd4bf"/></svg>'/>
</head>
<body>

<!-- Splash that shows briefly while React initializes -->
<div id="root"></div>
<div id="splash" style="position:fixed;inset:0;display:grid;place-items:center;background:#0b0e13;z-index:9999;transition:opacity 280ms ease;">
  <div style="display:flex;flex-direction:column;align-items:center;gap:14px;">
    <svg width="80" height="80" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="14" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-dasharray="30 60">
        <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="50" cy="50" r="22" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-dasharray="50 90" opacity="0.7">
        <animateTransform attributeName="transform" type="rotate" from="360 50 50" to="0 50 50" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="50" cy="50" r="30" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="60 130" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="50" cy="50" r="38" fill="none" stroke="#2dd4bf" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="70 170" opacity="0.35">
        <animateTransform attributeName="transform" type="rotate" from="360 50 50" to="0 50 50" dur="5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="50" cy="50" r="2" fill="#2dd4bf"/>
    </svg>
    <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.24em;color:#66717f;text-transform:uppercase;">ophamin · empirical observatory</div>
  </div>
</div>

<!-- React (production UMD) + Babel — pinned per project standard.
     Production React: ~138KB vs ~1.16MB for the dev build (88% smaller)
     and no dev-mode runtime checks. JSX still compiles in-browser via
     Babel-standalone, so the no-build philosophy is preserved. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Plain JS: data layer -->
<script src="app/data.js"></script>

<!-- Babel components — load in dependency order; each exports onto window -->
<script type="text/babel" data-presets="react" src="app/tweaks-panel.jsx"></script>
<script type="text/babel" data-presets="react" src="app/wheels.jsx"></script>
<script type="text/babel" data-presets="react" src="app/shell.jsx"></script>
<script type="text/babel" data-presets="react" src="app/overview.jsx"></script>
<script type="text/babel" data-presets="react" src="app/proofs.jsx"></script>
<script type="text/babel" data-presets="react" src="app/scenarios.jsx"></script>
<script type="text/babel" data-presets="react" src="app/run.jsx"></script>
<script type="text/babel" data-presets="react" src="app/telemetry.jsx"></script>
<script type="text/babel" data-presets="react" src="app/agents.jsx"></script>
<script type="text/babel" data-presets="react" src="app/lab.jsx"></script>
<script type="text/babel" data-presets="react" src="app/audit.jsx"></script>
<script type="text/babel" data-presets="react" src="app/chat.jsx"></script>
<script type="text/babel" data-presets="react" src="app/roadmap.jsx"></script>
<script type="text/babel" data-presets="react" src="app/discovery.jsx"></script>
<script type="text/babel" data-presets="react" src="app/inspector.jsx"></script>
<script type="text/babel" data-presets="react" src="app/control.jsx"></script>
<script type="text/babel" data-presets="react" src="app/control-infra.jsx"></script>
<script type="text/babel" data-presets="react" src="app/interop.jsx"></script>
<script type="text/babel" data-presets="react" src="app/integrations.jsx"></script>
<script type="text/babel" data-presets="react" src="app/substrate.jsx"></script>
<script type="text/babel" data-presets="react" src="app/cockpit.jsx"></script>
<script type="text/babel" data-presets="react" src="app/flow.jsx"></script>
<script type="text/babel" data-presets="react" src="app/config.jsx"></script>
<script type="text/babel" data-presets="react" src="app/models.jsx"></script>
<script type="text/babel" data-presets="react" src="app/toolkits.jsx"></script>
<script type="text/babel" data-presets="react" src="app/compose.jsx"></script>
<script type="text/babel" data-presets="react" src="app/verify.jsx"></script>
<script type="text/babel" data-presets="react" src="app/shortcuts.jsx"></script>
<script type="text/babel" data-presets="react" src="app/keyboard.jsx"></script>
<script type="text/babel" data-presets="react" src="app/intro.jsx"></script>
<script type="text/babel" data-presets="react" src="app/palette.jsx"></script>
<script type="text/babel" data-presets="react" src="app/app.jsx"></script>

<script>
  // Fade out splash once React renders.
  const _splash = document.getElementById('splash');
  const _rootEl = document.getElementById('root');
  const _mo = new MutationObserver(() => {
    if (_rootEl.children.length) {
      _mo.disconnect();
      setTimeout(() => {
        _splash.style.opacity = '0';
        setTimeout(() => _splash.remove(), 320);
      }, 200);
    }
  });
  _mo.observe(_rootEl, { childList: true });
  // safety
  setTimeout(() => { if (_splash.parentNode) { _splash.style.opacity = '0'; setTimeout(() => _splash.remove(), 320); } }, 6000);
</script>

</body>
</html>
