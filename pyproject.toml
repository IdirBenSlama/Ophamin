[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ophamin"
version = "0.1.0"
description = "Ophamin: an empirical framework for scaling and verifying iterative experimentation on a substrate under test (built for Kimera-SWM, independent of it)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Idir Ben Slama" }]
# Each pillar is backed by a mature, battle-tested library rather than a
# from-scratch implementation:
#   N  scikit-learn        cross-validation splitters
#   M  statsmodels         MixedLM, OLS + anova_lm
#   I  statsmodels         stats.meta_analysis.combine_effects
#   O  scipy + river       chi-squared GOF, streaming drift detectors
#   diagnostics  mapie     split conformal prediction
#   F  prov + mlflow + dvc PROV-O graphs, run tracking, dataset versioning
#   config  omegaconf      config composition / merge / dotted access
# lxml + rdflib are required because prov's serializer registry eagerly imports
# every serializer (XML, RDF) even when only PROV-JSON is used.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "mapie>=1.0",
    "river>=0.21",
    "prov>=2.0",
    "lxml>=4.9",
    "rdflib>=6.0",
    "omegaconf>=2.3",
    "mlflow>=2.9",
    "dvc>=3.0",
    "psutil>=5.9",   # instrumenting wheel — per-cycle CPU / RSS / page-fault sampler
]

[project.optional-dependencies]
viz = ["matplotlib>=3.6"]          # CumulativeMetaAnalysis.plot + reporting wheel charts
hydra = ["hydra-core>=1.3"]        # Hydra-driven entry points (OmegaConf is core)
well = ["h5py>=3.0"]               # TheWellCorpus — physics-simulation HDF5 datasets
telemetry = [                      # instrumenting wheel — optional richer telemetry
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
profile = [                        # instrumenting wheel — optional deep profilers
    "py-spy>=0.3",                 # sampling profiler (flamegraphs against running subprocess)
    "memray>=1.10",                # memory profiler
]
audit = [                          # auditing wheel — orchestrated static-analysis tools
    "ruff>=0.4",                   # fast Python linter (replaces flake8 / pylint / isort)
    "bandit>=1.7",                 # security linter
    "mypy>=1.8",                   # static type-checker
    "vulture>=2.10",               # dead-code detector
    "radon>=6.0",                  # cyclomatic complexity + maintainability index
    "pip-audit>=2.7",              # dependency-vulnerability scanner
]
all = [                            # convenience: everything optional, for full local install
    "matplotlib>=3.6",
    "hydra-core>=1.3",
    "h5py>=3.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "py-spy>=0.3",
    "memray>=1.10",
    "ruff>=0.4",
    "bandit>=1.7",
    "mypy>=1.8",
    "vulture>=2.10",
    "radon>=6.0",
    "pip-audit>=2.7",
]
dev = ["pytest>=7.0"]

[project.scripts]
ophamin = "ophamin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
