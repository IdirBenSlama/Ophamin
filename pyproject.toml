[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ophamin"
version = "0.64.5"
description = "An empirical observatory wrapped around a substrate under test — six wheels, signed proofs, falsifiable claims."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Idir Ben Slama" }]
keywords = [
    "empirical",
    "observatory",
    "falsifiability",
    "signed-proof",
    "campaign",
    "multiplicity-correction",
    "fwer",
    "fdr",
    "holm-bonferroni",
    "benjamini-hochberg",
    "scientific-reproducibility",
    "kimera-swm",
]
classifiers = [
    # See https://pypi.org/classifiers/ for the canonical list.
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

# Each pillar is backed by a mature, battle-tested library rather than a
# from-scratch implementation:
#   N  scikit-learn        cross-validation splitters
#   M  statsmodels         MixedLM, OLS + anova_lm
#   I  statsmodels         stats.meta_analysis.combine_effects
#   O  scipy + river       chi-squared GOF, streaming drift detectors
#   diagnostics  mapie     split conformal prediction
#   F  prov + mlflow + dvc PROV-O graphs, run tracking, dataset versioning
#   config  omegaconf      config composition / merge / dotted access
# lxml + rdflib are required because prov's serializer registry eagerly imports
# every serializer (XML, RDF) even when only PROV-JSON is used.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "mapie>=1.0",
    "river>=0.21",
    "prov>=2.0",
    "lxml>=4.9",
    "rdflib>=6.0",
    "omegaconf>=2.3",
    "mlflow>=2.9",
    "dvc>=3.0",
    "psutil>=5.9",   # instrumenting wheel — per-cycle CPU / RSS / page-fault sampler
    "jsonschema>=4.0",  # measuring/proof codec — JSON-Schema validation against proof/schema.json
]

[project.urls]
Homepage = "https://idirbenslama.github.io/Ophamin/"
Documentation = "https://idirbenslama.github.io/Ophamin/"
Repository = "https://github.com/IdirBenSlama/Ophamin"
Issues = "https://github.com/IdirBenSlama/Ophamin/issues"
Changelog = "https://github.com/IdirBenSlama/Ophamin/blob/main/CHANGELOG.md"
"Release notes" = "https://github.com/IdirBenSlama/Ophamin/releases"

[project.optional-dependencies]
viz = ["matplotlib>=3.6"]          # CumulativeMetaAnalysis.plot + reporting wheel charts
hydra = ["hydra-core>=1.3"]        # Hydra-driven entry points (OmegaConf is core)
docs = [                           # Phase L1 — public documentation site
    "mkdocs>=1.6",                 # the doc builder
    "mkdocs-material>=9.5",        # the canonical theme + nav widgets
    "mkdocstrings[python]>=0.26",  # auto-generated API reference from docstrings
    "mkdocs-include-markdown-plugin>=7.0",  # `{% include-markdown %}` for root files
    "pymdown-extensions>=10.0",    # tabs, code-block syntax, etc.
]
well = ["h5py>=3.0"]               # TheWellCorpus — physics-simulation HDF5 datasets
telemetry = [                      # instrumenting wheel — optional richer telemetry
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "prometheus_client>=0.17",     # PrometheusScrapeProbe — parse Kimera's /metrics
]
profile = [                        # instrumenting wheel — optional deep profilers
    "py-spy>=0.3",                 # sampling profiler (flamegraphs against running subprocess)
    "memray>=1.10",                # memory profiler
]
audit = [                          # auditing wheel — orchestrated static-analysis tools
    "ruff>=0.4",                   # fast Python linter (replaces flake8 / pylint / isort)
    "bandit>=1.7",                 # security linter
    "mypy>=1.8",                   # static type-checker
    "vulture>=2.10",               # dead-code detector
    "radon>=6.0",                  # cyclomatic complexity + maintainability index
    "pip-audit>=2.7",              # dependency-vulnerability scanner
    "cyclonedx-python-lib>=11.0",  # CycloneDX SBOM exporter (interop wheel)
    "deptry>=0.20",                # project-scope dependency checker (PR #9)
    "fawltydeps>=0.18",            # project-scope dependency checker (PR #9)
    "interrogate>=1.5",            # docstring-coverage pillar (PR #9 sibling)
    "pylint>=3.0",                 # deeper Python linter (deep-scope, opt-in)
    "refurb>=2.0",                 # Python ≥3.10 modernization suggestions
    "prospector>=1.10",            # multi-linter aggregator (deep-scope, opt-in)
]
analytic = [                       # measuring/ wheel statistical helpers
    "pingouin>=0.5",               # effect-size + multi-comparison correction
    "POT>=0.9",                    # optimal transport / Wasserstein
    "infomeasure>=0.6",            # entropy + MI + transfer-entropy
    "umap-learn>=0.5",             # 2-D dim reduction for reporting
]
causal = [                         # measuring/ wheel — causal inference
    "dowhy>=0.8",                  # PyWhy orchestrator
    "econml>=0.16",                # Microsoft HTE estimators
    "causalml>=0.16",              # Uber uplift modeling
    "tigramite>=5.2",              # PCMCI causal discovery on time series
]
tda = [                            # seeing/ + measuring/ — topological data analysis
    "ripser>=0.6",                 # fast persistent homology
    "scikit-tda>=1.0",             # umbrella (kepler-mapper, persim, etc.)
    # gudhi was previously declared here for "broadest simplicial-complex
    # coverage" but (a) no code in src/ or tests/ imports it and (b) gudhi
    # 3.x ships no linux/arm64 Python 3.12 wheel, breaking arm64 Docker
    # builds. Install explicitly via ``pip install gudhi`` on a supported
    # platform if a gudhi-backed scenario becomes load-bearing.
]
timeseries = [                     # comparing/drift_detection/ + measuring/
    "darts>=0.30",                 # forecasting + anomaly
    "tsfresh>=0.20",               # 1000+ feature extraction
    "pyod>=2.0",                   # 50+ outlier detectors
    "stumpy>=1.13",                # matrix-profile motif/discord
    "statsforecast>=2.0",          # classical forecasters
]
bayesian = [                       # measuring/ — Bayesian PPL
    "arviz>=1.0",                  # posterior visualization + diagnostics
    "pymc>=6.0",                   # Bayesian PPL
    "numpyro>=0.15",               # JAX-backed PPL (faster for large N)
]
property_test = [                  # auditing/ + scenarios — property + fuzz testing
    "hypothesis>=6.100",           # property-based testing
    "schemathesis>=3.30",          # API contract testing
    "coverage>=7.0",               # branch coverage
    "pytest-cov>=7.0",             # pytest integration for coverage.py
    "pytest-benchmark>=5.0",       # Phase S3 — pinned performance baselines
]
acceleration = [                   # core deps — when scenarios get slow
    "polars>=1.0",                 # faster pandas
    "duckdb>=1.0",                 # in-process analytical SQL
    "numba>=0.60",                 # JIT for NumPy
]
sat_smt = [                        # measuring/ — formal verification
    "z3-solver>=4.13",             # SMT solver
    "cvc5>=1.2",                   # alternative SMT (cross-check oracle)
]
graph = [                          # measuring/ — graph algorithms
    "igraph>=0.11",                # PageRank + community detection + betweenness
]
crdt = [                           # comparing/ — distributed-state probing
    "pycrdt>=0.10",                # Yjs CRDT (Python wrapper)
    "y-py>=0.6",                   # Yjs CRDT (alternative wrapper, cross-check oracle)
]
conformal = [                      # measuring/ — conformal prediction
    "crepes>=0.8",                 # NumPy conformal regressors + classifiers
    # Note: ``puncc`` was previously declared as a cross-check oracle here,
    # but (a) nothing in src/ or tests/ actually imports it, and (b) puncc
    # 0.9.1 pins ``scikit-learn~=1.3.0`` which conflicts with causalml's
    # ``scikit-learn>=1.6.0`` constraint, breaking CI on fresh installs.
    # If a puncc-based oracle becomes load-bearing, re-add under a separate
    # extra (e.g. ``conformal_oracle``) so it doesn't poison ``[all]``.
]
infotheory = [                     # measuring/ — information theory
    "pyitlib>=0.2",                # MI + entropy
    "ennemi>=1.4",                 # easy-API non-linear MI
]
mcp = [                            # interop wheel — MCP server (`ophamin mcp serve`)
    "mcp>=1.20",                   # Anthropic-spec Model Context Protocol Python SDK
]
all = [                            # convenience: everything optional, for full local install
    "matplotlib>=3.6",
    "hydra-core>=1.3",
    "h5py>=3.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "prometheus_client>=0.17",
    "py-spy>=0.3",
    "memray>=1.10",
    "ruff>=0.4",
    "bandit>=1.7",
    "mypy>=1.8",
    "vulture>=2.10",
    "radon>=6.0",
    "pip-audit>=2.7",
    "cyclonedx-python-lib>=11.0",
    "deptry>=0.20",
    "fawltydeps>=0.18",
    "interrogate>=1.5",
    "pylint>=3.0",
    "refurb>=2.0",
    "prospector>=1.10",
    "pingouin>=0.5",
    "POT>=0.9",
    "infomeasure>=0.6",
    "umap-learn>=0.5",
    "dowhy>=0.8",
    "econml>=0.16",
    "causalml>=0.16",
    "tigramite>=5.2",
    "ripser>=0.6",
    "scikit-tda>=1.0",
    # gudhi intentionally omitted — see [tda] for the reasoning
    "darts>=0.30",
    "tsfresh>=0.20",
    "pyod>=2.0",
    "stumpy>=1.13",
    "statsforecast>=2.0",
    "arviz>=1.0",
    "pymc>=6.0",
    "numpyro>=0.15",
    "hypothesis>=6.100",
    "schemathesis>=3.30",
    "coverage>=7.0",
    "polars>=1.0",
    "duckdb>=1.0",
    "numba>=0.60",
    "z3-solver>=4.13",
    "cvc5>=1.2",
    "igraph>=0.11",
    "pycrdt>=0.10",
    "y-py>=0.6",
    "crepes>=0.8",
    # puncc intentionally omitted — see [conformal] for the reasoning
    "pyitlib>=0.2",
    "ennemi>=1.4",
    "mcp>=1.20",                   # MCP server (0.17.0) — agent-callable interface
]
dev = ["pytest>=7.0"]
# `release` brings the build + verify tooling the .github/workflows/release.yml
# uses. Mirrored locally so an operator can `python -m build` + `twine check`
# without pip-installing the workflow's transient packages by hand.
release = [
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
ophamin = "ophamin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Upstream-deprecation warnings are noise we can't fix here — every one we
# filter is a known-and-tracked upstream issue. Filtering keeps the run
# log signal-to-noise high without hiding ophamin-side warnings.
filterwarnings = [
    "default",
    # mlflow uses codecs.open (deprecated in 3.14)
    "ignore:codecs.open\\(\\) is deprecated:DeprecationWarning:mlflow.*",
    # scipy precision-loss notes during moment calculations on near-identical
    # samples — expected for SPC pillar's identity-substrate baseline.
    "ignore:Precision loss occurred in moment calculation:RuntimeWarning:scipy.*",
    # stumpy notes about flat matrix-profile values on self-joins — that's
    # exactly the regime the test exercises.
    "ignore:A large number of values in `P`:UserWarning:stumpy.*",
    # pkg_resources is deprecated in 3.12+; vendored by many upstream libs
    "ignore:pkg_resources is deprecated:DeprecationWarning",
    "ignore:Deprecated call to.*pkg_resources:DeprecationWarning",
    # statsmodels emits a numpy<2 compat warning on np.ptp — fix lives upstream
    "ignore:.*numpy\\.ptp.*:DeprecationWarning:statsmodels.*",
]

# --- mypy strict configuration (Phase S1 of the elevation roadmap) --------
[tool.mypy]
# Target the same Python version we run on in CI.
python_version = "3.12"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

# Strict mode — every option that makes mypy unforgiving. Without these,
# the framework's type contracts are decorative; with them, every
# breach surfaces at type-check time, not runtime.
strict = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_reexport = false              # the framework re-exports a lot
implicit_reexport = true
check_untyped_defs = true
strict_equality = true

# Source root for the framework.
files = ["src/ophamin"]

# Per-module overrides: pillars that delegate heavily into untyped
# upstream libraries (river, mapie, prov) are allowed to lean on the
# inferred-Any return type until the upstream ships type stubs. This
# is per-module, NOT global — every other module sees strict mode.
[[tool.mypy.overrides]]
module = [
    "river.*",
    "mapie.*",
    "prov.*",
    "rdflib.*",
    "lxml.*",
    "dvc.*",
    "mlflow.*",
    "omegaconf.*",
    "h5py.*",
    "statsmodels.*",
    "scipy.*",
    "sklearn.*",
    "matplotlib.*",
    "psutil.*",
    "pandas.*",
    "jsonschema.*",
    "interrogate.*",
    "pyod.*",
    "persim.*",
    "pacmap.*",
    "npeet.*",
    "deel.*",
    "puncc.*",
    "pyphi.*",
    "tigramite.*",
    "ennemi.*",
    "pyitlib.*",
    "stumpy.*",
    "darts.*",
    "tsfresh.*",
    "pymc.*",
    "arviz.*",
    "numpyro.*",
    "hypothesis.*",
    "schemathesis.*",
    "z3.*",
    "cvc5.*",
    "igraph.*",
    "pycrdt.*",
    "y_py.*",
    "ripser.*",
    "gudhi.*",
    "kmapper.*",
    "umap.*",
    "POT.*",
    "ot.*",
    "infomeasure.*",
    "pingouin.*",
    "polars.*",
    "duckdb.*",
    "numba.*",
    "crepes.*",
    "puncc.*",
    "dowhy.*",
    "econml.*",
    "causalml.*",
    "mcp.*",
    "opentelemetry.exporter.*",       # OTel OTLP exporters — no stubs ship with the http subpackage
    "opentelemetry.sdk.trace.export.in_memory_span_exporter",  # SDK test utility — no stubs
]
ignore_missing_imports = true

# The MCP server module uses ``@mcp.tool()`` decorators from the
# ``mcp`` package, which has no type stubs (above override makes
# the import ``Any``-typed). Under ``disallow_untyped_decorators
# = true`` mypy would then flag every decorated function as
# untyped. Permit untyped decorators in just this subpackage —
# the rest of the codebase stays strict.
[[tool.mypy.overrides]]
module = ["ophamin.mcp.*"]
disallow_untyped_decorators = false
