[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ophamin"
version = "0.1.0"
description = "Ophamin: an empirical framework for scaling and verifying iterative experimentation on a substrate under test (built for Kimera-SWM, independent of it)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Idir Ben Slama" }]
# Each pillar is backed by a mature, battle-tested library rather than a
# from-scratch implementation:
#   N  scikit-learn        cross-validation splitters
#   M  statsmodels         MixedLM, OLS + anova_lm
#   I  statsmodels         stats.meta_analysis.combine_effects
#   O  scipy + river       chi-squared GOF, streaming drift detectors
#   diagnostics  mapie     split conformal prediction
#   F  prov + mlflow + dvc PROV-O graphs, run tracking, dataset versioning
#   config  omegaconf      config composition / merge / dotted access
# lxml + rdflib are required because prov's serializer registry eagerly imports
# every serializer (XML, RDF) even when only PROV-JSON is used.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "mapie>=1.0",
    "river>=0.21",
    "prov>=2.0",
    "lxml>=4.9",
    "rdflib>=6.0",
    "omegaconf>=2.3",
    "mlflow>=2.9",
    "dvc>=3.0",
    "psutil>=5.9",   # instrumenting wheel — per-cycle CPU / RSS / page-fault sampler
]

[project.optional-dependencies]
viz = ["matplotlib>=3.6"]          # CumulativeMetaAnalysis.plot + reporting wheel charts
hydra = ["hydra-core>=1.3"]        # Hydra-driven entry points (OmegaConf is core)
well = ["h5py>=3.0"]               # TheWellCorpus — physics-simulation HDF5 datasets
telemetry = [                      # instrumenting wheel — optional richer telemetry
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "prometheus_client>=0.17",     # PrometheusScrapeProbe — parse Kimera's /metrics
]
profile = [                        # instrumenting wheel — optional deep profilers
    "py-spy>=0.3",                 # sampling profiler (flamegraphs against running subprocess)
    "memray>=1.10",                # memory profiler
]
audit = [                          # auditing wheel — orchestrated static-analysis tools
    "ruff>=0.4",                   # fast Python linter (replaces flake8 / pylint / isort)
    "bandit>=1.7",                 # security linter
    "mypy>=1.8",                   # static type-checker
    "vulture>=2.10",               # dead-code detector
    "radon>=6.0",                  # cyclomatic complexity + maintainability index
    "pip-audit>=2.7",              # dependency-vulnerability scanner
    "cyclonedx-python-lib>=11.0",  # CycloneDX SBOM exporter (interop wheel)
    "deptry>=0.20",                # project-scope dependency checker (PR #9)
    "fawltydeps>=0.18",            # project-scope dependency checker (PR #9)
    "interrogate>=1.5",            # docstring-coverage pillar (PR #9 sibling)
    "pylint>=3.0",                 # deeper Python linter (deep-scope, opt-in)
    "refurb>=2.0",                 # Python ≥3.10 modernization suggestions
    "prospector>=1.10",            # multi-linter aggregator (deep-scope, opt-in)
]
analytic = [                       # measuring/ wheel statistical helpers
    "pingouin>=0.5",               # effect-size + multi-comparison correction
    "POT>=0.9",                    # optimal transport / Wasserstein
    "infomeasure>=0.6",            # entropy + MI + transfer-entropy
    "umap-learn>=0.5",             # 2-D dim reduction for reporting
]
causal = [                         # measuring/ wheel — causal inference
    "dowhy>=0.8",                  # PyWhy orchestrator
    "econml>=0.16",                # Microsoft HTE estimators
    "causalml>=0.16",              # Uber uplift modeling
    "tigramite>=5.2",              # PCMCI causal discovery on time series
]
tda = [                            # seeing/ + measuring/ — topological data analysis
    "ripser>=0.6",                 # fast persistent homology
    "scikit-tda>=1.0",             # umbrella (kepler-mapper, persim, etc.)
    "gudhi>=3.10",                 # broadest simplicial-complex coverage
]
timeseries = [                     # comparing/drift_detection/ + measuring/
    "darts>=0.30",                 # forecasting + anomaly
    "tsfresh>=0.20",               # 1000+ feature extraction
    "pyod>=2.0",                   # 50+ outlier detectors
    "stumpy>=1.13",                # matrix-profile motif/discord
    "statsforecast>=2.0",          # classical forecasters
]
bayesian = [                       # measuring/ — Bayesian PPL
    "arviz>=1.0",                  # posterior visualization + diagnostics
    "pymc>=6.0",                   # Bayesian PPL
    "numpyro>=0.15",               # JAX-backed PPL (faster for large N)
]
property_test = [                  # auditing/ + scenarios — property + fuzz testing
    "hypothesis>=6.100",           # property-based testing
    "schemathesis>=3.30",          # API contract testing
    "coverage>=7.0",               # branch coverage
]
acceleration = [                   # core deps — when scenarios get slow
    "polars>=1.0",                 # faster pandas
    "duckdb>=1.0",                 # in-process analytical SQL
    "numba>=0.60",                 # JIT for NumPy
]
sat_smt = [                        # measuring/ — formal verification
    "z3-solver>=4.13",             # SMT solver
    "cvc5>=1.2",                   # alternative SMT (cross-check oracle)
]
graph = [                          # measuring/ — graph algorithms
    "igraph>=0.11",                # PageRank + community detection + betweenness
]
crdt = [                           # comparing/ — distributed-state probing
    "pycrdt>=0.10",                # Yjs CRDT (Python wrapper)
    "y-py>=0.6",                   # Yjs CRDT (alternative wrapper, cross-check oracle)
]
conformal = [                      # measuring/ — conformal prediction
    "crepes>=0.8",                 # NumPy conformal regressors + classifiers
    "puncc>=0.9",                  # conformal classification + detection (deel-puncc)
]
infotheory = [                     # measuring/ — information theory
    "pyitlib>=0.2",                # MI + entropy
    "ennemi>=1.4",                 # easy-API non-linear MI
]
all = [                            # convenience: everything optional, for full local install
    "matplotlib>=3.6",
    "hydra-core>=1.3",
    "h5py>=3.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "prometheus_client>=0.17",
    "py-spy>=0.3",
    "memray>=1.10",
    "ruff>=0.4",
    "bandit>=1.7",
    "mypy>=1.8",
    "vulture>=2.10",
    "radon>=6.0",
    "pip-audit>=2.7",
    "cyclonedx-python-lib>=11.0",
    "deptry>=0.20",
    "fawltydeps>=0.18",
    "interrogate>=1.5",
    "pylint>=3.0",
    "refurb>=2.0",
    "prospector>=1.10",
    "pingouin>=0.5",
    "POT>=0.9",
    "infomeasure>=0.6",
    "umap-learn>=0.5",
    "dowhy>=0.8",
    "econml>=0.16",
    "causalml>=0.16",
    "tigramite>=5.2",
    "ripser>=0.6",
    "scikit-tda>=1.0",
    "gudhi>=3.10",
    "darts>=0.30",
    "tsfresh>=0.20",
    "pyod>=2.0",
    "stumpy>=1.13",
    "statsforecast>=2.0",
    "arviz>=1.0",
    "pymc>=6.0",
    "numpyro>=0.15",
    "hypothesis>=6.100",
    "schemathesis>=3.30",
    "coverage>=7.0",
    "polars>=1.0",
    "duckdb>=1.0",
    "numba>=0.60",
    "z3-solver>=4.13",
    "cvc5>=1.2",
    "igraph>=0.11",
    "pycrdt>=0.10",
    "y-py>=0.6",
    "crepes>=0.8",
    "puncc>=0.9",
    "pyitlib>=0.2",
    "ennemi>=1.4",
]
dev = ["pytest>=7.0"]

[project.scripts]
ophamin = "ophamin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
